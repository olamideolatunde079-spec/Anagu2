# ============================================================================
# Anagu — EMQX 5.x Broker ACL Rules
# Restricts messaging exclusively to Anagu land administration topic namespaces.
# ============================================================================

# Allow backend/admin clients full pub/sub under land/#
{allow, {username, {re, "^anagu_"}}, all, ["land/#"]}.

# Allow authenticated field/citizen clients to publish offline sync and subscribe to updates
{allow, all, subscribe, ["land/registration/+", "land/title/+"]}.
{allow, all, publish,   ["land/sync/offline-queue"]}.

# Deny system-wide wildcard subscriptions and $SYS internal telemetry to general clients
{deny, all, all, ["$SYS/#", "#"]}.
