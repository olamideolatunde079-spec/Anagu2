% ============================================================================
% Anagu — EMQX 5.x Broker ACL Rules
% Strictly restricts topic publish/subscribe to authenticated ANAGU identities
% and blocks unauthorized access to sensitive land administration topics.
% ============================================================================

% 1. Backend API service client (username prefixed with 'anagu_backend' or 'anagu_service')
{allow, {username, {re, "^anagu_(backend|service)"}}, all, [
    "land/registration/#",
    "land/application/#",
    "land/document/#",
    "land/survey/#",
    "land/review/#",
    "land/title/#",
    "land/transfer/#",
    "land/marketplace/#",
    "land/sync/#"
]}.

% 2. Authenticated users/field devices may subscribe only to their own user channel
%    and publish offline sync payloads scoped to their client/user namespace.
{allow, {username, {re, "^user_[a-zA-Z0-9_-]+$"}}, subscribe, ["land/user/${username}/#"]}.
{allow, {username, {re, "^user_[a-zA-Z0-9_-]+$"}}, publish,   ["land/sync/offline-queue/${username}"]}.

% 3. Deny anonymous clients and all sensitive or wildcard topic subscriptions
{deny, {username, ""}, all, ["#"]}.
{deny, all, all, ["$SYS/#", "land/review/#", "land/document/#", "land/admin/#", "#"]}.
