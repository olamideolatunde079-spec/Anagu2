# ============================================================================
# Anagu — Redis 7 Configuration
# Session cache, rate limiting, and background job queues.
# Password is supplied via --requirepass "${REDIS_PASSWORD}" at runtime.
# ============================================================================

bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Persistence (AOF + RDB snapshots for durable cache/queue recovery)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /data

# Memory & Eviction
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security: disable dangerous administrative commands on shared runtime
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command DEBUG ""
